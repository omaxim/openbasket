[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "openbasket"
readme = "README.md"
description = "Look through an ETF, fund or bond by ISIN to the securities behind it."
dynamic = [
    "version",
]
dependencies = [
    "kedro~=1.7.0",
    "kedro-datasets[pandas-csvdataset,pandas-parquetdataset,json-jsondataset]~=9.6",
    "duckdb>=1.1",
    "pandas>=2.1",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tickerinside>=0.1",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ipython>=8.10",
]
docs = [
    "sphinx>=7",
    "myst-parser>=3",
    "furo",
]

[project.scripts]
openbasket = "openbasket.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.version]
attr = "openbasket.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "openbasket"
project_name = "openbasket"
kedro_init_version = "1.7.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (deselect with -m 'not network')"]
