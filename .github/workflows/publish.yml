name: publish

on:
  schedule:
    # The 3rd of each month, 06:00 UTC: issuers' month-end files are out by then.
    - cron: "0 6 3 * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "Build only this many funds per universe source (empty = the full universe). Sample runs are not released or deployed unless deploy_sample is ticked."
        type: number
        required: false
      deploy_sample:
        description: "Release and deploy a sample run anyway. This REPLACES this month's production release files and the live site with the sample."
        type: boolean
        default: false
      release:
        description: "Create or update the GitHub Release for this month (full runs, or sample runs with deploy_sample)"
        type: boolean
        default: true
      min_funds:
        description: "Fail unless at least this many funds are published (empty = default)"
        type: number
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SITE_URL: https://openbasket.leithresearch.org
  # No usage data from Kedro or Kedro-Viz; with telemetry on, Kedro-Viz would
  # also put an analytics script into the published pipeline page.
  KEDRO_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      tag: ${{ steps.settings.outputs.tag }}
      live: ${{ steps.settings.outputs.live }}
    env:
      SAMPLE: ${{ inputs.sample }}
      DEPLOY_SAMPLE: ${{ inputs.deploy_sample }}
      # A sample run only has to produce something; a full run must cover the universe.
      MIN_FUNDS: ${{ inputs.min_funds || (inputs.sample && '1') || vars.OPENBASKET_MIN_FUNDS || '10000' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install -e '.[dev,docs,viz]'

      - name: Resolve run settings
        id: settings
        run: |
          if [ -n "$SAMPLE" ] && ! [[ "$SAMPLE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::sample must be a positive whole number, got '$SAMPLE'"
            exit 1
          fi
          [[ "$MIN_FUNDS" =~ ^[0-9]+$ ]] || { echo "::error::min_funds must be a whole number, got '$MIN_FUNDS'"; exit 1; }
          # Only full runs (and sample runs explicitly marked deploy_sample) touch
          # the production release and site.
          if [ -z "$SAMPLE" ] || [ "$DEPLOY_SAMPLE" = "true" ]; then live=true; else live=false; fi
          if [ -n "$SAMPLE" ] && [ "$live" = "true" ]; then
            echo "::warning::deploy_sample is set: this sample run replaces the production release files and site."
          fi
          quarters=$(python -c "import yaml; print('-'.join(yaml.safe_load(open('conf/base/parameters.yml'))['nport']['quarters']))")
          {
            echo "tag=$(date -u +%Y-%m)"
            echo "quarters=$quarters"
            echo "live=$live"
          } >> "$GITHUB_OUTPUT"

      - name: Restore N-PORT downloads
        id: nport-cache
        uses: actions/cache/restore@v6
        with:
          path: data/01_raw/nport
          key: nport-${{ steps.settings.outputs.quarters }}
          restore-keys: nport-

      - name: Restore OpenFIGI cache
        uses: actions/cache/restore@v6
        with:
          path: data/03_primary/openfigi_cache.parquet
          key: openfigi-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: openfigi-

      - name: Write .env
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::The SEC_USER_AGENT secret is not set; SEC refuses requests without one."
            exit 1
          fi
          [ -n "$OPENFIGI_API_KEY" ] || echo "::warning::The OPENFIGI_API_KEY secret is not set; OpenFIGI will run at the anonymous rate limit."
          umask 077
          printf 'OPENFIGI_API_KEY=%s\nSEC_USER_AGENT=%s\n' "$OPENFIGI_API_KEY" "$SEC_USER_AGENT" > .env

      - name: Ingest
        run: kedro run --pipeline=ingest

      - name: Save N-PORT downloads
        if: steps.nport-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/01_raw/nport
          key: ${{ steps.nport-cache.outputs.cache-primary-key }}

      - name: Security master
        run: kedro run --pipeline=security_master

      - name: Consolidate
        run: kedro run --pipeline=consolidate

      - name: Universe
        run: |
          args=()
          [ -z "$SAMPLE" ] || args+=("--params=universe.sample=$SAMPLE")
          kedro run --pipeline=universe "${args[@]}"

      - name: Save OpenFIGI cache
        # Kept even when a later step fails, so a rerun does not repeat the lookups.
        if: always() && hashFiles('data/03_primary/openfigi_cache.parquet') != ''
        uses: actions/cache/save@v6
        with:
          path: data/03_primary/openfigi_cache.parquet
          key: openfigi-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish
        # Writes build/site/api/v1 and build/release (publish.site_dir, publish.release_dir).
        run: kedro run --pipeline=publish --params=publish.release_tag=${{ steps.settings.outputs.tag }}

      - name: Docs
        run: sphinx-build -b html -W --keep-going -q docs/source docs/build/html

      - name: Assemble site
        run: python scripts/assemble_site.py --docs docs/build/html --api build/site/api --out build/pages

      - name: Pipeline diagram
        # kedro viz build writes ./build of the project it runs in; the script
        # runs it in a temporary copy so build/site, build/release and
        # build/pages are left alone, then copies the result here.
        run: python scripts/build_pipeline_viz.py --out build/pages/pipeline

      - name: Check build
        # Fails, so nothing is released or deployed, on too few funds, a source
        # without name, link, licence or credit, a row without source or as-of
        # date, or a site over GitHub Pages' 1 GB limit. Warns on stale N-PORT.
        run: |
          python scripts/check_build.py \
            --api build/site/api --release build/release --pages build/pages --require-pipeline \
            --min-funds "$MIN_FUNDS" --live "${{ steps.settings.outputs.live }}" \
            --summary "$GITHUB_STEP_SUMMARY" --notes build/release-notes.md

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            build/release
            build/release-notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: needs.build.outputs.live == 'true' && (github.event_name == 'schedule' || inputs.release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" dist/release/* \
              --title "openbasket $TAG" \
              --notes-file dist/release-notes.md \
              --target "$GITHUB_SHA"
          fi

  deploy:
    # After the release, so the site never links to files that are not there yet.
    # Sample runs stop before this unless deploy_sample was ticked.
    needs: [build, release]
    if: >-
      always() && needs.build.result == 'success' && needs.build.outputs.live == 'true'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
