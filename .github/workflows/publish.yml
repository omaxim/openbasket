name: publish

on:
  schedule:
    # The 3rd of each month, 06:00 UTC: issuers' month-end files are out by then.
    - cron: "0 6 3 * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "Build only this many funds (empty = the full universe)"
        type: number
        required: false
      release:
        description: "Create or update the GitHub Release for this month"
        type: boolean
        default: true
      min_funds:
        description: "Fail unless at least this many funds are built (empty = default)"
        type: number
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SITE_URL: https://openbasket.leithresearch.org

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      tag: ${{ steps.settings.outputs.tag }}
    env:
      SAMPLE: ${{ inputs.sample }}
      # A sample run only has to produce something; a full run must cover the universe.
      MIN_FUNDS: ${{ inputs.min_funds || (inputs.sample && '1') || vars.OPENBASKET_MIN_FUNDS || '10000' }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install -e '.[dev,docs]'

      - name: Resolve run settings
        id: settings
        run: |
          if [ -n "$SAMPLE" ] && ! [[ "$SAMPLE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::sample must be a positive whole number, got '$SAMPLE'"
            exit 1
          fi
          [[ "$MIN_FUNDS" =~ ^[0-9]+$ ]] || { echo "::error::min_funds must be a whole number, got '$MIN_FUNDS'"; exit 1; }
          quarters=$(python -c "import yaml; print('-'.join(yaml.safe_load(open('conf/base/parameters.yml'))['nport']['quarters']))")
          {
            echo "tag=$(date -u +%Y-%m)"
            echo "quarters=$quarters"
          } >> "$GITHUB_OUTPUT"

      - name: Restore N-PORT downloads
        id: nport-cache
        uses: actions/cache/restore@v4
        with:
          path: data/01_raw/nport
          key: nport-${{ steps.settings.outputs.quarters }}
          restore-keys: nport-

      - name: Restore OpenFIGI cache
        uses: actions/cache/restore@v4
        with:
          path: data/03_primary/openfigi_cache.parquet
          key: openfigi-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: openfigi-

      - name: Write .env
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::The SEC_USER_AGENT secret is not set; SEC refuses requests without one."
            exit 1
          fi
          [ -n "$OPENFIGI_API_KEY" ] || echo "::warning::The OPENFIGI_API_KEY secret is not set; OpenFIGI will run at the anonymous rate limit."
          umask 077
          printf 'OPENFIGI_API_KEY=%s\nSEC_USER_AGENT=%s\n' "$OPENFIGI_API_KEY" "$SEC_USER_AGENT" > .env

      - name: Ingest
        run: kedro run --pipeline=ingest

      - name: Save N-PORT downloads
        if: steps.nport-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/01_raw/nport
          key: ${{ steps.nport-cache.outputs.cache-primary-key }}

      - name: Security master
        run: kedro run --pipeline=security_master

      - name: Consolidate
        run: kedro run --pipeline=consolidate

      - name: Universe
        run: |
          args=()
          [ -z "$SAMPLE" ] || args+=("--params=universe.sample=$SAMPLE")
          kedro run --pipeline=universe "${args[@]}"

      - name: Save OpenFIGI cache
        # Kept even when a later step fails, so a rerun does not repeat the lookups.
        if: always() && hashFiles('data/03_primary/openfigi_cache.parquet') != ''
        uses: actions/cache/save@v4
        with:
          path: data/03_primary/openfigi_cache.parquet
          key: openfigi-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish
        run: kedro run --pipeline=publish --params=publish.release_tag=${{ steps.settings.outputs.tag }}

      - name: Docs
        run: sphinx-build -b html -W --keep-going -q docs/source docs/build/html

      - name: Assemble site
        run: python scripts/assemble_site.py --docs docs/build/html --api build/site/api --out build/pages

      - name: Quality check
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("build/release/quality-report.json").read_text())
          meta_path = Path("build/site/api/v1/meta.json")
          meta = json.loads(meta_path.read_text()) if meta_path.exists() else {}
          n_funds = report.get("n_funds", meta.get("n_funds"))
          min_funds = int(os.environ["MIN_FUNDS"])

          def scalars(obj, prefix=""):
              for key, value in obj.items():
                  if isinstance(value, dict):
                      yield from scalars(value, f"{prefix}{key}.")
                  elif not isinstance(value, list):
                      yield f"{prefix}{key}", value

          lines = [
              f"## openbasket {meta.get('release_tag', '')}",
              "",
              f"Funds built: **{n_funds}** (minimum {min_funds})"
              + (f", sample of {os.environ['SAMPLE']}" if os.environ.get("SAMPLE") else ""),
              "",
              "| Quality report | Value |",
              "|---|---|",
              *(f"| `{key}` | {value} |" for key, value in scalars(report)),
          ]
          if meta.get("sources"):
              lines += [
                  "",
                  "| Source | Funds | As of | Credit |",
                  "|---|---|---|---|",
                  *(
                      f"| [{s.get('name')}]({s.get('url')}) | {s.get('n_funds', '')} "
                      f"| {s.get('as_of_min', '')} to {s.get('as_of_max', '')} | {s.get('credit', '')} |"
                      for s in meta["sources"]
                  ),
              ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")

          if not isinstance(n_funds, int) or n_funds < min_funds:
              print(f"::error::{n_funds} funds built, fewer than the minimum of {min_funds}; nothing is deployed or released.")
              raise SystemExit(1)
          PY

      - name: Release notes
        env:
          TAG: ${{ steps.settings.outputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          meta = json.loads(Path("build/site/api/v1/meta.json").read_text())
          site = os.environ["SITE_URL"]
          lines = [
              f"Monthly build of [openbasket]({site}/), an aggregator that looks through "
              "funds to the securities they hold, by ISIN.",
              "",
              f"Built {meta.get('built_at', '')} from {os.environ['GITHUB_SHA'][:7]}. "
              f"{meta.get('n_funds', '')} funds, {meta.get('n_isins', '')} constituent ISINs.",
              "",
              "## Files",
              "",
              "- `openbasket-lookthrough.parquet`: every constituent row of every fund, untruncated.",
              "- `openbasket-funds.parquet`: one row per fund, with its source and as-of date.",
              "- `quality-report.json`: coverage figures for this build.",
              "",
              f"Columns and the static JSON API are described in the docs at {site}/.",
              "",
              "## Sources",
              "",
              "openbasket publishes no data of its own. Every row names its source, a link "
              "to it and its as-of date. This build used:",
              "",
              "| Source | Funds | As of | Licence | Credit |",
              "|---|---|---|---|---|",
          ]
          for s in meta.get("sources", []):
              lines.append(
                  f"| [{s.get('name')}]({s.get('url')}) | {s.get('n_funds', '')} "
                  f"| {s.get('as_of_min', '')} to {s.get('as_of_max', '')} "
                  f"| {s.get('licence', '')} | {s.get('credit', '')} |"
              )
          lines += [
              "",
              "Where a source's licence requires credit (TickerInside, CC BY 4.0), keep its "
              "credit line and each row's `source_ref` in anything you publish from these files.",
              "",
              "Not investment advice. openbasket is not affiliated with, or endorsed by, any "
              "fund issuer or data provider named here. Check figures against the source "
              "before relying on them.",
          ]
          Path("build/release-notes.md").write_text("\n".join(lines) + "\n")
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            build/release
            build/release-notes.md
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'schedule' || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" dist/release/* \
              --title "openbasket $TAG" \
              --notes-file dist/release-notes.md \
              --target "$GITHUB_SHA"
          fi

  deploy:
    # After the release, so the site never links to files that are not there yet.
    needs: [build, release]
    if: always() && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
