{#- The open|basket wordmark of the landing page, and a way back to it. -#}
{%- set landing = pathto(master_doc)|replace("index.html", "") ~ "../" %}
<div class="ob-brand">
  <a class="sidebar-brand ob-wordmark" href="{{ pathto(master_doc) }}" aria-label="openbasket documentation">
    <span class="wm-open">open</span><span class="wm-basket">basket</span>
  </a>
  <p class="ob-sub">Documentation · <a href="https://www.leithresearch.org/">by Leith Research</a></p>
  <a class="ob-back" href="{{ landing }}">&larr; Search funds</a>
</div>
