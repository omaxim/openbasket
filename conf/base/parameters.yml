# One ISIN, or several separated by semicolons:
#   kedro run --pipeline=lookthrough --params=isin=IE00B5BMR087
isin: US4642872000  # iShares Core S&P 500 ETF (IVV)

nport:
  # Quarterly SEC data sets, newest last. Each is about 450 MB zipped.
  quarters: [2026q3]
  raw_dir: data/01_raw/nport
  parquet_dir: data/02_intermediate/nport
  overwrite: false

issuers:
  # iShares regional sites whose fund lists are downloaded by `ingest`.
  ishares_sites: [uk, us]
  # SPDR fund finders: "us" (US ETFs, including SPY and DIA) and "emea" (UCITS).
  spdr_regions: [us, emea]
  # Issuer adapters registered in openbasket.sources.issuers are used by
  # `ingest` (their fund lists join issuer_products) and by the look-through
  # (their holdings files). null uses every registered adapter; a list uses
  # only those. `disabled` drops some either way.
  enabled: null
  disabled: []

lookthrough:
  # Holdings sources in priority order. "issuer" is iShares and SPDR;
  # "top_holdings" is a placeholder and is skipped.
  source_order: [issuer, tickerinside, nport, top_holdings]
  # Take the first source that resolves at least this much weight to ISINs;
  # if none does, take the one that resolves the most.
  min_resolved_pct: 90.0
  max_depth: 4
  # Expand options and swaps on a fund into that fund's companies (weighted by the
  # derivative's market value, labelled as derivative exposure).
  look_through_derivatives: true
  use_openfigi: true
  enrich_openfigi: true
  openfigi_cache: data/03_primary/openfigi_cache.parquet
  # Issuer responses, one file per fund per day, written only once they parse.
  issuer_cache_dir: data/01_raw/issuers/holdings
  # An ISIN or CUSIP that N-PORT reports under more than this many fund
  # series LEIs is a placeholder or an error and is not used to match a fund.
  # Holdings under other LEIs (a trust's, a typo) are not counted.
  max_issuer_leis_per_isin: 3
  # Funds with no free full holdings, mapped to a fund on the same index.
  # A proxy wins over an issuer listing, so swap ETFs can be shown through a
  # physical stand-in. Output rows from a proxy say so in matched_via and
  # note. A proxy ticker is a US ticker. Example:
  #   IE000OY7BDY9:   # iShares MSCI North America Swap UCITS ETF
  #     ticker: IVV
  #     note: "swap-based; physical S&P 500 ETF as a stand-in"
  proxies: {}

universe:
  # Which fund lists to run: ishares, spdr, nport and any issuer adapter's
  # name. null runs them all. A US fund that is both an issuer fund and an
  # N-PORT series counts as the issuer's.
  sources: null
  # Quick runs: only these fund ids or series IDs, `sample` funds per source
  # (seeded), then the first `limit`. null runs everything.
  #   kedro run --pipeline=universe --params=universe.sample=15
  ids: []
  sample: null
  seed: 0
  limit: null
  # Stop reading sources for a fund once one resolves lookthrough.min_resolved_pct.
  stop_early: true
  # Ask TickerInside only for tickers in its issuer layer (one list download).
  tickerinside_prefilter: true
  log_every: 100
  openfigi_save_every: 500
  rows_per_part: 500000
  work_dir: data/07_model_output/universe_parts
  issuers:
    ishares: iShares
    spdr: SPDR
  http:
    # Minimum seconds between two requests to the same host.
    default_interval_s: 1.0
    per_host_interval_s:
      tickerinside.com: 0.25

publish:
  # The scheduled build passes the tag: --params=publish.release_tag=2026-11.
  # null uses the current UTC year and month.
  release_tag: null
  repo: omaxim/openbasket
  site_dir: build/site
  release_dir: build/release
  max_constituents: 1000
  # If api/v1 comes out larger, fund files are cut further (never below
  # min_constituents) and the cut is logged and put in the quality report.
  site_budget_mb: 800
  min_constituents: 50
  # The quality report lists constituent ISINs that rows attribute to more
  # than this many different issuer names.
  shared_isin_issuers: 20
  # Every source a published row can come from. Each fund file credits the
  # sources its rows came from; meta.json lists them all. `listed_by` names
  # the source in the credit of a fund it lists but has no holdings for.
  # Issuer adapters bring their own entries.
  sources:
    ishares:
      name: iShares (BlackRock) fund holdings
      url: https://www.ishares.com/
      licence: Public website data; terms not reviewed
      credit: Holdings data from iShares by BlackRock
      listed_by: iShares by BlackRock
    spdr:
      name: SPDR (State Street) daily fund holdings
      url: https://www.ssga.com/
      licence: Public website data; terms not reviewed
      credit: Holdings data from SPDR ETFs by State Street Global Advisors
      listed_by: SPDR ETFs by State Street Global Advisors
    tickerinside:
      name: TickerInside
      url: https://tickerinside.com/
      licence: CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
      credit: "Holdings from TickerInside (https://tickerinside.com/), licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/); changed by openbasket: tickers mapped to ISINs through SEC Form N-PORT and OpenFIGI, names taken from N-PORT"
    nport:
      name: SEC Form N-PORT
      url: https://www.sec.gov/data-research/sec-markets-data/form-n-port-data-sets
      licence: Public US government data
      credit: Holdings from SEC Form N-PORT filings, U.S. Securities and Exchange Commission
      listed_by: SEC Form N-PORT
    security_master:
      name: Security master built from SEC Form N-PORT
      url: https://www.sec.gov/data-research/sec-markets-data/form-n-port-data-sets
      licence: Public US government data
      credit: Security details from SEC Form N-PORT filings, U.S. Securities and Exchange Commission
    openfigi:
      name: OpenFIGI
      url: https://www.openfigi.com/
      licence: OpenFIGI API terms; terms not reviewed
      credit: Names and security types from OpenFIGI (https://www.openfigi.com/)
