<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openbasket has moved</title>
<script>
  location.replace("https://openbasket.leithresearch.org" + location.pathname + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="1; url=https://openbasket.leithresearch.org/">
<link rel="canonical" href="https://openbasket.leithresearch.org/">
<meta name="robots" content="noindex">
<style>
  :root { --paper: #f6f1e7; --ink: #1d1b18; --muted: #6b645a; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1d1b18; --ink: #f6f1e7; --muted: #a59d90; }
  }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    min-height: 100vh; display: grid; place-content: center; padding: 0 16px;
    font: 1.0625rem/1.5 Georgia, "Times New Roman", serif; text-align: center;
  }
  a { color: inherit; text-underline-offset: 3px; }
  p.small { color: var(--muted); font-size: 0.875rem; max-width: 34em; margin-inline: auto; }
  code { font-size: 0.8125rem; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <p>openbasket now lives at</p>
  <p><a id="target" href="https://openbasket.leithresearch.org/">openbasket.leithresearch.org</a></p>
  <p class="small">You should be taken there automatically.</p>
  <p class="small">Using the JSON API or a script? This address only redirects browsers.
  Request <code>https://openbasket.leithresearch.org/api/v1/&hellip;</code> directly.</p>
</main>
<script>
  document.getElementById("target").href =
    "https://openbasket.leithresearch.org" + location.pathname + location.search + location.hash;
</script>
</body>
</html>
