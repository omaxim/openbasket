# ingest ---------------------------------------------------------------------
nport_raw_manifest:
  type: pandas.CSVDataset
  filepath: data/01_raw/nport/manifest.csv

nport_parquet_manifest:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/nport/manifest.csv

sec_fund_tickers:
  type: pandas.ParquetDataset
  filepath: data/01_raw/sec/company_tickers_mf.parquet

issuer_products:
  type: pandas.ParquetDataset
  filepath: data/01_raw/issuers/issuer_products.parquet

# security_master ------------------------------------------------------------
nport_positions:
  type: openbasket.datasets.DuckDBParquetDataset
  filepath: data/02_intermediate/nport_positions.parquet

cusip_isin_map:
  type: openbasket.datasets.DuckDBParquetDataset
  filepath: data/03_primary/cusip_isin_map.parquet

security_master:
  type: openbasket.datasets.DuckDBParquetDataset
  filepath: data/03_primary/security_master.parquet
  order_by: isin

ticker_isin_map:
  type: pandas.ParquetDataset
  filepath: data/03_primary/ticker_isin_map.parquet

# Currency, coupon and maturity per ISIN, read by the name matcher (lookthrough.name_matching).
security_terms:
  type: openbasket.datasets.DuckDBParquetDataset
  filepath: data/03_primary/security_terms.parquet
  order_by: isin

sedol_isin_map:
  type: pandas.ParquetDataset
  filepath: data/03_primary/sedol_isin_map.parquet

# consolidate ----------------------------------------------------------------
nport_latest_filings:
  type: pandas.ParquetDataset
  filepath: data/03_primary/nport_latest_filings.parquet

fund_master:
  type: pandas.ParquetDataset
  filepath: data/03_primary/fund_master.parquet

nport_holdings:
  type: openbasket.datasets.DuckDBParquetDataset
  filepath: data/03_primary/nport_holdings.parquet
  order_by: series_id

# lookthrough ----------------------------------------------------------------
# Overwritten on every run; each row carries its input_isin.
lookthrough_positions:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/lookthrough_positions.parquet

lookthrough_unidentified:
  type: pandas.CSVDataset
  filepath: data/08_reporting/lookthrough_unidentified.csv

lookthrough_summary:
  type: pandas.CSVDataset
  filepath: data/08_reporting/lookthrough_summary.csv

lookthrough:
  type: pandas.CSVDataset
  filepath: data/08_reporting/lookthrough.csv

# universe -------------------------------------------------------------------
universe:
  type: pandas.ParquetDataset
  filepath: data/03_primary/universe.parquet

universe_selected:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/universe_selected.parquet

universe_funds:
  type: pandas.ParquetDataset
  filepath: data/07_model_output/universe_funds.parquet

universe_constituents:
  type: openbasket.datasets.DuckDBParquetDataset
  filepath: data/07_model_output/universe_constituents.parquet
  order_by: fund_id

universe_run:
  type: json.JSONDataset
  filepath: data/08_reporting/universe_run.json

# publish --------------------------------------------------------------------
# The site and release files go to publish.site_dir and publish.release_dir.
quality_report:
  type: json.JSONDataset
  filepath: data/08_reporting/quality_report.json

# Company ISIN -> GICS sector from FinanceDatabase (MIT); fills rows without a sector.
sector_map:
  type: pandas.ParquetDataset
  filepath: data/03_primary/sector_map.parquet
