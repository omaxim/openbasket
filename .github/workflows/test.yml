name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install -e '.[dev,docs]'

      - name: Tests
        run: pytest -q -m 'not network'

      - name: Docs
        run: sphinx-build -b html -W --keep-going -q docs/source docs/build/html
